plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = '1.0.1+1.20.1'
group = 'org.ejectfb.cubetwitchchatfb'

base {
    archivesName = 'ejectfb-cubetwitchchatfb'
}

def minecraftVersion = '1.20.1'
def fabricLoaderVersion = '0.16.14'
def fabricApiVersion = '0.92.6+1.20.1'
def yarnMappings = '1.20.1+build.10'

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
